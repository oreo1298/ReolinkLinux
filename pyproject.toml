[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reolinklinux"
version = "1.0.1"
description = "A modern Linux client for Reolink PoE cameras and NVRs: live view, PTZ, playback and recording"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ReolinkLinux contributors" }]
keywords = ["Reolink", "camera", "CCTV", "NVR", "PTZ", "RTSP", "surveillance", "mpv"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video :: Display",
    "Topic :: Security",
]
# The GUI needs PySide6 (from your distribution, or the "gui" extra) and the libmpv
# shared library; recording needs the ffmpeg program. The core and the CLI need nothing.
dependencies = []

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.5"]
keyring = ["keyring>=23"]
full = ["PySide6-Essentials>=6.5", "keyring>=23"]
dev = ["pytest>=7", "PySide6-Essentials>=6.5", "ruff"]

[project.scripts]
reolinkctl = "reolinklinux.cli:main"

[project.gui-scripts]
reolinklinux = "reolinklinux.gui.app:main"

[project.urls]
Homepage = "https://github.com/oreo1298/ReolinkLinux"
Repository = "https://github.com/oreo1298/ReolinkLinux"
Issues = "https://github.com/oreo1298/ReolinkLinux/issues"

[tool.setuptools.packages.find]
include = ["reolinklinux*"]

[tool.setuptools.package-data]
reolinklinux = ["data/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# E501 long lines, E741 ambiguous names
ignore = ["E501", "E741"]
